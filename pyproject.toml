[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uk-due-diligence-mcp"
version = "1.3.0"
description = "UK due diligence MCP server — Companies House, Charity Commission, HMLR, Gazette, HMRC VAT"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Paul Boucher" },
]
keywords = [
    "mcp", "uk", "companies-house", "charity-commission", "land-registry",
    "gazette", "hmrc", "vat", "due-diligence", "fastmcp", "kyc", "compliance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "fastmcp==3.2.4",
    "mcp==1.27.0",
    "httpx==0.28.1",
    "pydantic==2.13.0",
    "python-dotenv==1.2.2",
    "mcpfleet-obs>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/paulieb89/uk-due-diligence-mcp"
Repository = "https://github.com/paulieb89/uk-due-diligence-mcp"

[project.scripts]
uk-due-diligence-mcp = "server:main"

[tool.hatch.build.targets.sdist]
exclude = [
    "fly.toml",
    "Dockerfile",
    "server.json",
    ".mcp.json",
    ".env.example",
    "dist/",
    "research/",
]

[tool.hatch.build.targets.wheel]
only-include = [
    "server.py",
    "companies_house.py",
    "companies_house_documents.py",
    "charity.py",
    "disqualified.py",
    "land_registry.py",
    "gazette.py",
    "hmrc_vat.py",
    "sanctions.py",
    "search_fetch.py",
    "models.py",
    "http_client.py",
]


[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
