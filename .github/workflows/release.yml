name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # The version triad must agree with each other AND with the release tag
      # before anything is published. Triad-only was not enough: releasing v1.4.0
      # with every file still at 1.3.0 passed, built a 1.3.0 wheel, uploaded
      # nothing (skip_existing: true) and deployed prod anyway. Gating publish is
      # the point — once a version is on PyPI the drift is permanent.
      #
      # --no-project, unlike everywhere else: this job never runs `uv sync`, so
      # there is no venv for --no-sync to use. The pinned interpreter also
      # guarantees tomllib (3.11+) without depending on the runner's python3.
      - name: Repo invariants and release tag
        run: uv run --no-project --python 3.12 python .claude/hooks/check_invariants.py --standalone --expect "${{ github.event.release.tag_name }}"

      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip_existing: true

  deploy:
    name: Deploy to Fly
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - run: flyctl deploy --remote-only --ha=false --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Fail the release if prod does not answer /health after the deploy.
      - name: Post-deploy health check
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://uk-due-diligence-mcp.fly.dev/health)
            if [ "$code" = "200" ]; then
              echo "Health check passed (HTTP $code) on attempt $i"
              exit 0
            fi
            echo "Health check attempt $i: HTTP $code — retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 10 attempts"
          exit 1

